name: AKS CI-CD Reusable Workflow

on:
  workflow_call:
    inputs:
      branch-name:
        description: "Rama que se procesa"
        required: true
        type: string

      image-name:
        description: "Nombre de la imagen Docker"
        required: true
        type: string

      dockerfile-path:
        description: "Directorio que contiene el Dockerfile"
        required: true
        type: string

      deployment-file:
        description: "Ruta del manifiesto Kubernetes"
        required: true
        type: string

      deployment-name:
        description: "Nombre del Deployment Kubernetes"
        required: true
        type: string

      container-name:
        description: "Nombre del contenedor Kubernetes"
        required: true
        type: string

      target-environment:
        description: "Ambiente de destino"
        required: false
        type: string
        default: DEV

      image-tag:
        description: "Etiqueta de imagen existente para QA o PROD"
        required: false
        type: string
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read

jobs:
  validate-pull-request:
    name: Validate container build
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container without publishing
        shell: bash
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
        run: |
          set -euo pipefail
          docker build \
            --file "$DOCKERFILE_PATH/Dockerfile" \
            "$DOCKERFILE_PATH"

  # Construye y publica la imagen para DEV.
  # Para QA/PROD valida que la imagen indicada ya exista en ACR.
  prepare-image:
    name: Build and publish container image
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: read
      id-token: write

    outputs:
      image-tag: ${{ steps.image-info.outputs.image-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment parameters
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target-environment }}
          BRANCH_NAME: ${{ inputs.branch-name }}
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            DEV|QA|PROD) ;;
            *) echo "Ambiente no permitido: $TARGET_ENV"; exit 1 ;;
          esac

          if [[ "$TARGET_ENV" != "DEV" && -z "$INPUT_IMAGE_TAG" ]]; then
            echo "QA y PROD requieren una etiqueta de imagen existente."
            exit 1
          fi

          if [[ "$TARGET_ENV" == "PROD" && ! "$BRANCH_NAME" =~ ^release/ ]]; then
            echo "Producción solo permite despliegues desde release/*."
            exit 1
          fi

      - name: Define image tag
        id: image-info
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target-environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" == "DEV" ]]; then
            TAG="$GITHUB_SHA"
          else
            TAG="$INPUT_IMAGE_TAG"
          fi

          echo "image-tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Azure login
        if: inputs.target-environment == 'DEV'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: inputs.target-environment == 'DEV'
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build and push image
        if: inputs.target-environment == 'DEV'
        shell: bash
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ steps.image-info.outputs.image-tag }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail

          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker build \
            --file "$DOCKERFILE_PATH/Dockerfile" \
            --tag "$IMAGE" \
            "$DOCKERFILE_PATH"

          docker push "$IMAGE"

      - name: Azure login for existing image validation
        if: inputs.target-environment != 'DEV'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate existing image for QA or PROD
        if: inputs.target-environment != 'DEV'
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ steps.image-info.outputs.image-tag }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker manifest inspect "$IMAGE" >/dev/null

  # Este job queda pausado hasta recibir aprobación en el Environment.
  deploy:
    name: Deploy to AKS
    needs: prepare-image
    if: github.event_name != 'pull_request'

    runs-on: [self-hosted, Linux, X64]

    environment:
      name: ${{ inputs.target-environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS context
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Apply Kubernetes manifests
        shell: bash
        env:
          DEPLOYMENT_FILE: ${{ inputs.deployment-file }}
          AKS_NAMESPACE: ${{ vars.AKS_NAMESPACE }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ needs.prepare-image.outputs.image-tag }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          sed "s|__IMAGE__|$IMAGE|g" "$DEPLOYMENT_FILE" | kubectl apply \
            --filename - \
            --namespace "$AKS_NAMESPACE"

      - name: Verify deployment
        shell: bash
        env:
          AKS_NAMESPACE: ${{ vars.AKS_NAMESPACE }}
          DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        run: |
          set -euo pipefail
          kubectl rollout status "deployment/$DEPLOYMENT_NAME" \
            --namespace "$AKS_NAMESPACE" \
            --timeout=180s
